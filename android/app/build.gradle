plugins { id 'com.android.application' }

android {
    namespace 'org.termite.app'
    compileSdk 34
    defaultConfig {
        applicationId 'org.termite.app'
        minSdk 24
        targetSdk 34
        versionCode 141
        versionName '1.4.1'
    }
    signingConfigs {
        // One fixed key, kept in the repository, so every new build installs over the old one.
        termite {
            storeFile file('termite.keystore')
            storePassword 'termite'
            keyAlias 'termite'
            keyPassword 'termite'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.termite
        }
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
